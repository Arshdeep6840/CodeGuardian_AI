name: Django CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: codeguardian_test_db
          POSTGRES_USER: codeguardian_user
          POSTGRES_PASSWORD: codeguardian_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U codeguardian_user -d codeguardian_test_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DEBUG: True
      SECRET_KEY: github-actions-secret-key
      ALLOWED_HOSTS: 127.0.0.1,localhost

      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: codeguardian_test_db
      DB_USER: codeguardian_user
      DB_PASSWORD: codeguardian_password
      DB_HOST: localhost
      DB_PORT: 5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-django

      - name: Run Ruff lint
        run: |
          ruff check .

      - name: Check Django migrations
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Run Django tests
        run: |
          python manage.py test