version: '3.8'

services:
  web:
    build: .
    command: gunicorn --bind 0.0.0.0:8000 --workers 3 codeguardian.wsgi:application
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - codeguardian/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery_worker:
    build: .
    command: celery -A codeguardian worker -l info
    volumes:
      - .:/app
    env_file:
      - codeguardian/.env
    depends_on:
      - redis
      - db

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=codeguardian
      - POSTGRES_USER=codeguardian
      - POSTGRES_PASSWORD=supersecret
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeguardian"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
