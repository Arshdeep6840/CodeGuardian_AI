function chip(text,dot){
  return `<span class="task-chip"><i class="ti ti-point" style="color:${dot};font-size:10px" aria-hidden="true"></i>${text}</span>`;
}

function render(filter){
  const el=document.getElementById('plan');
  el.innerHTML='';
  WEEKS.filter(w=>filter===0||w.p===filter).forEach(w=>{
    const ph=P[w.p];
    const ms=w.w===7?`<span class="milestone" style="background:#E1F5EE;color:#085041"><i class="ti ti-flag" aria-hidden="true" style="font-size:12px"></i>MVP</span>`:
              w.w===13?`<span class="milestone" style="background:#FAEEDA;color:#633806"><i class="ti ti-flag" aria-hidden="true" style="font-size:12px"></i>Beta</span>`:
              w.w===16?`<span class="milestone" style="background:#EEEDFE;color:#3C3489"><i class="ti ti-rocket" aria-hidden="true" style="font-size:12px"></i>Launch</span>`:'';
    const sec=document.createElement('div');
    sec.className='section-card';
    sec.innerHTML=`<div class="wk-hdr"><i class="ti ti-calendar" aria-hidden="true" style="font-size:14px;color:${ph.dot}"></i>Week ${w.w} — ${w.title}<span class="ph-pill" style="background:${ph.bg};color:${ph.tc}">${ph.label}: ${ph.name}</span>${ms}</div>`+
    w.days.map(d=>`<div class="day-row"><div class="day-label">${d.d}</div><div class="day-body"><div class="day-title">${d.t}</div><div>${d.tasks.map(t=>chip(t,ph.dot)).join('')}</div></div></div>`).join('');
    el.appendChild(sec);
  });
}

render(0);

document.getElementById('fb').addEventListener('click',e=>{
  const b=e.target.closest('.fbtn');
  if(!b)return;
  document.querySelectorAll('.fbtn').forEach(x=>{
    x.classList.remove('on');
    x.style.background='transparent';
    x.style.color='var(--color-text-secondary)';
    x.style.borderColor='var(--color-border-secondary)';
  });
  b.classList.add('on');
  const p=parseInt(b.dataset.p);
  if(p===0){b.style.background='#EEEDFE';b.style.color='#3C3489';b.style.borderColor='#AFA9EC';}
  else{const ph=P[p];b.style.background=ph.bg;b.style.color=ph.tc;b.style.borderColor=ph.dot;}
  render(p);
});
